# Mem0 Agent Configuration

method_name: "mem0"
method_type: "agentic_memory"
description: "Mem0 Agent - Agentic memory with automatic memory extraction and retrieval"

model:
  provider: "openai"
  name: "gpt-5.1"
  temperature: 0.3
  max_completion_tokens: 40960

agent_params:
  retrieve_num: 5
  chunk_size_tokens: 4096
  max_context_tokens: 64000

embedding:
  provider: "local"
  model: "models/bge-small-en-v1.5"
  dim: 384
