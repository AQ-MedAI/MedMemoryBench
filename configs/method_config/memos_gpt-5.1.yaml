# MemOS Agent Configuration - tree_text mode

method_name: "memos"
method_type: "agentic_memory"
description: "MemOS tree_text adapter: Neo4j graph + BM25 + reranker + MemoryManager"

model:
  provider: "openai"
  name: "gpt-5.1"
  temperature: 0.3
  max_completion_tokens: 40960

embedding:
  provider: "local"
  model: "bge-small-en-v1.5"
  model_path: "models/bge-small-en-v1.5"
  dim: 384

agent_params:
  retrieve_num: 10
  memos_backend: "openai"
  memos_model: "gpt-5.1"
  text_mem_type: "tree_text"

  # Search configuration
  search_mode: "fast"
  search_strategy:
    bm25: true
    cot: false
  reorganize: false

  # Neo4j configuration
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "memos_benchmark"
  neo4j_db_name: "memos_eval"

  # Token limits
  max_input_tokens: 40960
  max_question_tokens: 10000
  max_context_tokens: 64000
  max_memory_tokens: 40960
